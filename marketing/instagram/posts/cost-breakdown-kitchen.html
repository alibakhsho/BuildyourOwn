<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<title>Kitchen Renovation Cost Breakdown</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #12161C;
    color: #F2F4F7;
    position: relative;
  }
  .container {
    width: 100%; height: 100%;
    padding: 60px;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  /* Decorative elements */
  .bg-glow {
    position: absolute; top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(249,115,22,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }
  .bg-glow-2 {
    position: absolute; bottom: -150px; left: -100px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(249,115,22,0.06) 0%, transparent 70%);
    border-radius: 50%;
  }
  .grid-lines {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(249,115,22,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(249,115,22,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .tag {
    display: inline-block;
    background: rgba(249,115,22,0.15);
    border: 1px solid rgba(249,115,22,0.3);
    color: #F97316;
    font-size: 14px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .header {
    position: relative; z-index: 2;
    margin-bottom: 8px;
  }
  .header h1 {
    font-size: 52px; font-weight: 900;
    line-height: 1.05;
    background: linear-gradient(135deg, #FFFFFF 0%, #F2F4F7 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header h1 span {
    background: linear-gradient(135deg, #F97316 0%, #FB923C 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .subtitle {
    font-size: 18px;
    color: rgba(242,244,247,0.5);
    margin-top: 8px;
    font-weight: 400;
  }
  .items {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
    gap: 6px;
    margin: 20px 0;
  }
  .item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    transition: all 0.3s;
  }
  .item:hover { background: rgba(249,115,22,0.08); border-color: rgba(249,115,22,0.2); }
  .item-left {
    display: flex; align-items: center; gap: 16px;
  }
  .item-dot {
    width: 8px; height: 8px;
    background: #F97316;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(249,115,22,0.5);
  }
  .item-name {
    font-size: 22px; font-weight: 500;
    color: rgba(242,244,247,0.85);
  }
  .item-price {
    font-size: 24px; font-weight: 700;
    color: #F2F4F7;
    font-variant-numeric: tabular-nums;
  }
  .total-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px;
    background: linear-gradient(135deg, rgba(249,115,22,0.15) 0%, rgba(249,115,22,0.05) 100%);
    border: 2px solid rgba(249,115,22,0.4);
    border-radius: 16px;
    margin-top: 8px;
  }
  .total-label {
    font-size: 22px; font-weight: 700;
    color: #F97316;
    letter-spacing: 2px; text-transform: uppercase;
  }
  .total-price {
    font-size: 42px; font-weight: 900;
    background: linear-gradient(135deg, #F97316 0%, #FB923C 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .footer {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 24px;
  }
  .cta {
    display: inline-block;
    background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
    color: #12161C;
    font-size: 18px; font-weight: 800;
    padding: 16px 32px;
    border-radius: 50px;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 32px rgba(249,115,22,0.35);
  }
  .logo {
    font-size: 20px; font-weight: 800;
    color: rgba(242,244,247,0.4);
    letter-spacing: 1px;
  }
  .logo span { color: #F97316; }
</style>
</head>
<body>
<div class="container">
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>
  <div class="grid-lines"></div>

  <div class="header">
    <div class="tag">📊 Cost Breakdown</div>
    <h1>Kitchen <span>Renovation</span></h1>
    <div class="subtitle">AI-estimated line-by-line breakdown</div>
  </div>

  <div class="items">
    <div class="item">
      <div class="item-left"><div class="item-dot"></div><div class="item-name">Cabinets</div></div>
      <div class="item-price">$8,200</div>
    </div>
    <div class="item">
      <div class="item-left"><div class="item-dot"></div><div class="item-name">Benchtop</div></div>
      <div class="item-price">$3,400</div>
    </div>
    <div class="item">
      <div class="item-left"><div class="item-dot"></div><div class="item-name">Plumbing</div></div>
      <div class="item-price">$4,800</div>
    </div>
    <div class="item">
      <div class="item-left"><div class="item-dot"></div><div class="item-name">Electrical</div></div>
      <div class="item-price">$2,600</div>
    </div>
    <div class="item">
      <div class="item-left"><div class="item-dot"></div><div class="item-name">Tiling</div></div>
      <div class="item-price">$3,200</div>
    </div>
    <div class="item">
      <div class="item-left"><div class="item-dot"></div><div class="item-name">Appliances</div></div>
      <div class="item-price">$5,500</div>
    </div>
    <div class="item">
      <div class="item-left"><div class="item-dot"></div><div class="item-name">Labour</div></div>
      <div class="item-price">$6,800</div>
    </div>
    <div class="total-row">
      <div class="total-label">Total Estimate</div>
      <div class="total-price">$34,500</div>
    </div>
  </div>

  <div class="footer">
    <div class="cta">Get YOUR estimate free →</div>
    <div class="logo"><span>Build</span>YourOwn</div>
  </div>
</div>
</body>
</html>
