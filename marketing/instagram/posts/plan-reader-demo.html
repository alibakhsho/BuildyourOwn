<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<title>AI Plan Reader Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #12161C;
    color: #F2F4F7;
    position: relative;
  }
  .container {
    width: 100%; height: 100%;
    padding: 60px;
    display: flex; flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  /* Blueprint background */
  .blueprint-bg {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .blueprint-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(18,22,28,0.8) 100%);
  }
  .header {
    position: relative; z-index: 2;
    margin-bottom: 24px;
  }
  .tag {
    display: inline-block;
    background: rgba(249,115,22,0.15);
    border: 1px solid rgba(249,115,22,0.3);
    color: #F97316;
    font-size: 14px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 48px; font-weight: 900;
    line-height: 1.1;
  }
  .header h1 span { color: #F97316; }
  .subtitle {
    font-size: 17px;
    color: rgba(242,244,247,0.5);
    margin-top: 10px;
  }
  /* Floor plan mockup */
  .plan-area {
    position: relative; z-index: 2;
    flex: 1;
    margin: 10px 0;
    border: 2px solid rgba(249,115,22,0.2);
    border-radius: 16px;
    background: rgba(0,0,0,0.3);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .plan-inner {
    position: relative;
    width: 860px; height: 540px;
  }
  .room {
    position: absolute;
    border: 2px solid;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .room-label {
    font-size: 16px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .room-dims {
    font-size: 12px; font-weight: 500;
    margin-top: 4px;
    opacity: 0.7;
  }
  .room-living {
    top: 20px; left: 20px; width: 380px; height: 300px;
    border-color: #F97316;
    background: rgba(249,115,22,0.08);
    color: #F97316;
  }
  .room-kitchen {
    top: 20px; left: 420px; width: 260px; height: 200px;
    border-color: #22D3EE;
    background: rgba(34,211,238,0.08);
    color: #22D3EE;
  }
  .room-bed1 {
    top: 340px; left: 20px; width: 260px; height: 180px;
    border-color: #A78BFA;
    background: rgba(167,139,250,0.08);
    color: #A78BFA;
  }
  .room-bed2 {
    top: 340px; left: 300px; width: 240px; height: 180px;
    border-color: #34D399;
    background: rgba(52,211,153,0.08);
    color: #34D399;
  }
  .room-bath {
    top: 240px; left: 420px; width: 160px; height: 140px;
    border-color: #FB923C;
    background: rgba(251,146,60,0.08);
    color: #FB923C;
  }
  .room-garage {
    top: 240px; left: 600px; width: 240px; height: 280px;
    border-color: rgba(242,244,247,0.3);
    background: rgba(242,244,247,0.03);
    color: rgba(242,244,247,0.5);
  }
  .room-entry {
    top: 20px; left: 700px; width: 140px; height: 200px;
    border-color: #FBBF24;
    background: rgba(251,191,36,0.08);
    color: #FBBF24;
  }
  /* Scanning animation line */
  .scan-line {
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, #F97316, transparent);
    box-shadow: 0 0 20px rgba(249,115,22,0.5);
    animation: scan 3s ease-in-out infinite;
  }
  @keyframes scan {
    0% { top: 0; opacity: 1; }
    100% { top: 100%; opacity: 0.3; }
  }
  /* Detection dots */
  .detect-dot {
    position: absolute;
    width: 10px; height: 10px;
    background: #F97316;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(249,115,22,0.8);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.5); opacity: 0.5; }
  }
  .detect-dot:nth-child(1) { top: 18px; left: 18px; animation-delay: 0s; }
  .detect-dot:nth-child(2) { top: 18px; left: 398px; animation-delay: 0.3s; }
  .detect-dot:nth-child(3) { top: 338px; left: 18px; animation-delay: 0.6s; }
  .detect-dot:nth-child(4) { top: 238px; left: 418px; animation-delay: 0.9s; }

  .steps {
    position: relative; z-index: 2;
    display: flex; gap: 20px;
    margin-top: 16px;
  }
  .step {
    flex: 1;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: rgba(249,115,22,0.08);
    border: 1px solid rgba(249,115,22,0.15);
    border-radius: 12px;
  }
  .step-num {
    width: 32px; height: 32px;
    background: #F97316;
    color: #12161C;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800;
    flex-shrink: 0;
  }
  .step-text {
    font-size: 15px; font-weight: 600;
    color: rgba(242,244,247,0.85);
  }
  .footer {
    position: absolute; bottom: 40px; right: 60px; z-index: 2;
  }
  .logo {
    font-size: 20px; font-weight: 800;
    color: rgba(242,244,247,0.4);
  }
  .logo span { color: #F97316; }
</style>
</head>
<body>
<div class="container">
  <div class="blueprint-bg"></div>
  <div class="blueprint-overlay"></div>

  <div class="header">
    <div class="tag">🏠 AI Plan Reader</div>
    <h1>AI reads your <span>building plans</span></h1>
    <div class="subtitle">Upload a photo → rooms detected → costs calculated</div>
  </div>

  <div class="plan-area">
    <div class="plan-inner">
      <div class="scan-line"></div>
      <div class="detect-dot"></div>
      <div class="detect-dot"></div>
      <div class="detect-dot"></div>
      <div class="detect-dot"></div>

      <div class="room room-living">
        <div class="room-label">Living</div>
        <div class="room-dims">5.4m × 4.2m</div>
      </div>
      <div class="room room-kitchen">
        <div class="room-label">Kitchen</div>
        <div class="room-dims">3.6m × 3.0m</div>
      </div>
      <div class="room room-bed1">
        <div class="room-label">Bed 1</div>
        <div class="room-dims">3.6m × 3.2m</div>
      </div>
      <div class="room room-bed2">
        <div class="room-label">Bed 2</div>
        <div class="room-dims">3.2m × 3.0m</div>
      </div>
      <div class="room room-bath">
        <div class="room-label">Bathroom</div>
        <div class="room-dims">2.2m × 2.0m</div>
      </div>
      <div class="room room-garage">
        <div class="room-label">Garage</div>
        <div class="room-dims">3.4m × 6.0m</div>
      </div>
      <div class="room room-entry">
        <div class="room-label">Entry</div>
        <div class="room-dims">2.0m × 2.8m</div>
      </div>
    </div>
  </div>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">Upload a photo</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">Rooms detected</div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">Costs calculated</div>
    </div>
  </div>

  <div class="footer">
    <div class="logo"><span>Build</span>YourOwn</div>
  </div>
</div>
</body>
</html>
