<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1080">
<title>Meet Priya - Estimating Engineer / QS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  body {
    width: 1080px; height: 1080px; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #12161C;
    color: #F2F4F7;
    position: relative;
  }
  .container {
    width: 100%; height: 100%;
    padding: 70px;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .hex-grid {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      radial-gradient(circle at 75% 25%, rgba(249,115,22,0.04) 0%, transparent 50%),
      radial-gradient(circle at 25% 75%, rgba(249,115,22,0.04) 0%, transparent 50%);
  }
  .corner-accent-tl {
    position: absolute; top: 0; left: 0;
    width: 200px; height: 200px;
    border-top: 3px solid rgba(249,115,22,0.3);
    border-left: 3px solid rgba(249,115,22,0.3);
  }
  .corner-accent-br {
    position: absolute; bottom: 0; right: 0;
    width: 200px; height: 200px;
    border-bottom: 3px solid rgba(249,115,22,0.3);
    border-right: 3px solid rgba(249,115,22,0.3);
  }
  .series-tag {
    display: inline-block;
    background: rgba(249,115,22,0.12);
    border: 1px solid rgba(249,115,22,0.25);
    color: #F97316;
    font-size: 14px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    padding: 10px 24px;
    border-radius: 50px;
    margin-bottom: 40px;
    position: relative; z-index: 2;
  }
  .emoji-avatar {
    position: relative; z-index: 2;
    width: 200px; height: 200px;
    background: linear-gradient(135deg, rgba(249,115,22,0.2) 0%, rgba(249,115,22,0.05) 100%);
    border: 3px solid rgba(249,115,22,0.4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 100px;
    margin-bottom: 32px;
    box-shadow:
      0 0 60px rgba(249,115,22,0.15),
      inset 0 0 40px rgba(249,115,22,0.05);
  }
  .emoji-glow {
    position: absolute;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(249,115,22,0.12) 0%, transparent 70%);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .name {
    position: relative; z-index: 2;
    font-size: 72px; font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(135deg, #FFFFFF 0%, #E2E8F0 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .role {
    position: relative; z-index: 2;
    font-size: 22px; font-weight: 600;
    color: #F97316;
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 40px;
  }
  .quote-block {
    position: relative; z-index: 2;
    max-width: 720px;
    margin-bottom: 40px;
  }
  .quote-mark {
    font-size: 64px;
    color: rgba(249,115,22,0.3);
    line-height: 0.5;
    margin-bottom: 8px;
  }
  .quote-text {
    font-size: 30px; font-weight: 600;
    color: #F2F4F7;
    line-height: 1.4;
    font-style: italic;
  }
  .description {
    position: relative; z-index: 2;
    font-size: 18px;
    color: rgba(242,244,247,0.62);
    line-height: 1.6;
    max-width: 640px;
  }
  .bottom-bar {
    position: absolute; bottom: 50px; left: 70px; right: 70px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 2;
  }
  .crew-dots {
    display: flex; gap: 10px;
  }
  .crew-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: rgba(242,244,247,0.15);
  }
  .crew-dot.active {
    background: #F97316;
    box-shadow: 0 0 12px rgba(249,115,22,0.5);
  }
  .logo {
    font-size: 20px; font-weight: 800;
    color: rgba(242,244,247,0.4);
  }
  .logo span { color: #F97316; }
</style>
</head>
<body>
<div class="container">
  <div class="hex-grid"></div>
  <div class="corner-accent-tl"></div>
  <div class="corner-accent-br"></div>

  <div class="series-tag">Meet the AI Crew</div>

  <div class="emoji-avatar">
    <div class="emoji-glow"></div>
    📐
  </div>

  <div class="name">PRIYA</div>
  <div class="role">Estimating Engineer / QS</div>

  <div class="quote-block">
    <div class="quote-mark">"</div>
    <div class="quote-text">Does this total look right for the area?</div>
  </div>

  <div class="description">
    Priya cross-checks every cost against live market rates, calculates
    quantities from your plans, and flags anything that looks off — your digital QS.
  </div>

  <div class="bottom-bar">
    <div class="crew-dots">
      <div class="crew-dot"></div>
      <div class="crew-dot active"></div>
      <div class="crew-dot"></div>
      <div class="crew-dot"></div>
      <div class="crew-dot"></div>
      <div class="crew-dot"></div>
    </div>
    <div class="logo"><span>Build</span>YourOwn</div>
  </div>
</div>
</body>
</html>
