<!doctype html>
<!-- Reel studio: renders Instagram reels (1080×1920) from the real 3D engine,
     one frame at a time. Driven by render.mjs — see README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>BYO reel studio</title>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #EEF1EE; }
  body { font-family: 'Plus Jakarta Sans', 'Inter Display', Inter, system-ui, sans-serif; color: #14171A; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; }
  #shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(238,241,238,0.96) 0, rgba(238,241,238,0) 24%, rgba(238,241,238,0) 62%, rgba(238,241,238,0.94) 86%); }
  #brand { position: absolute; top: 120px; left: 64px; display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 34px; letter-spacing: -0.01em; }
  #brand img { width: 64px; height: 64px; border-radius: 14px; }
  #eyebrow { position: absolute; top: 236px; left: 64px; right: 64px; font-weight: 700; font-size: 30px; letter-spacing: 0.1em; color: #C2570A; }
  #headline { position: absolute; top: 284px; left: 64px; right: 64px; font-weight: 800; font-size: 92px; line-height: 1.02; letter-spacing: -0.03em; }
  #panel { position: absolute; left: 56px; right: 56px; bottom: 300px; background: rgba(255,255,255,0.9); border: 1px solid rgba(20,23,26,0.08);
    border-radius: 44px; padding: 40px 44px 36px; box-shadow: 0 30px 80px rgba(20,23,26,0.16); }
  #plabel { font-weight: 600; font-size: 28px; color: #6B7279; display: flex; justify-content: space-between; }
  #price { font-weight: 800; font-size: 104px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  #bar { height: 10px; border-radius: 10px; background: rgba(20,23,26,0.08); overflow: hidden; margin: 14px 0 22px; }
  #bar i { display: block; height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, #F5C518, #C2570A); }
  #chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip { font-weight: 700; font-size: 26px; padding: 12px 22px; border-radius: 99px; background: rgba(20,23,26,0.07); color: #6B7279; }
  .chip.on { background: #F5C518; color: #14171A; }
  .chip.done { background: #14171A; color: #fff; }
  #sub { font-weight: 600; font-size: 34px; line-height: 1.3; color: #3A4046; margin-top: 6px; }
  #cta { position: absolute; left: 0; right: 0; bottom: 190px; text-align: center; font-weight: 700; font-size: 30px; color: #3A4046; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="shade"></div>
  <div id="brand"><img src="/logo-mark.png" alt=""><span>BuildYourOwn</span></div>
  <div id="eyebrow"></div>
  <div id="headline"></div>
  <div id="panel">
    <div id="plabel"><span id="pl"></span><span id="pr"></span></div>
    <div id="price"></div>
    <div id="bar"><i></i></div>
    <div id="chips"></div>
    <div id="sub"></div>
  </div>
  <div id="cta">Free to try · link in bio</div>
  <script type="module" src="./studio.js"></script>
</body>
</html>
