<!doctype html>
<!-- Reel studio: renders Instagram reels (1080×1920) from the real 3D engine,
     one frame at a time. Driven by render.mjs — see README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>BYO reel studio</title>
<style>
  /* Minimal: paper, ink, one accent. No cards, no boxes — type and a hairline. */
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #EDEBE6; }
  body { font-family: 'Plus Jakarta Sans', 'Inter Display', Inter, system-ui, sans-serif; color: #17191C; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; }
  #shade { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, #EDEBE6 0, rgba(237,235,230,0) 20%, rgba(237,235,230,0) 70%, #EDEBE6 90%); }
  #brand { position: absolute; top: 132px; left: 72px; display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 28px; letter-spacing: 0.01em; color: #17191C; }
  #brand img { width: 44px; height: 44px; border-radius: 10px; }
  #eyebrow { position: absolute; top: 250px; left: 72px; right: 72px; font-weight: 600; font-size: 22px; letter-spacing: 0.22em; color: #B4530A; }
  #headline { position: absolute; top: 296px; left: 72px; right: 72px; font-weight: 500; font-size: 80px; line-height: 1.06; letter-spacing: -0.035em; }
  #panel { position: absolute; left: 72px; right: 72px; bottom: 290px; }
  #plabel { font-weight: 500; font-size: 24px; letter-spacing: 0.02em; color: #7A7F85; display: flex; justify-content: space-between; align-items: baseline; }
  #price { font-weight: 500; font-size: 112px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1.12; margin-top: 4px; }
  #bar { height: 2px; background: rgba(23,25,28,0.12); overflow: hidden; margin: 20px 0 22px; }
  #bar i { display: block; height: 100%; width: 100%; transform-origin: left; background: #17191C; }
  #chips { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 28px; }
  .chip { font-weight: 500; font-size: 22px; letter-spacing: 0.02em; color: #A9ADB1; }
  .chip.on { color: #B4530A; font-weight: 700; }
  .chip.done { color: #17191C; }
  #sub { font-weight: 400; font-size: 32px; line-height: 1.35; color: #4A4F55; margin-top: 10px; }
  #cta { position: absolute; left: 72px; right: 72px; bottom: 196px; font-weight: 500; font-size: 22px; letter-spacing: 0.02em; color: #7A7F85; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="shade"></div>
  <div id="brand"><img src="/logo-mark.png" alt=""><span>BuildYourOwn</span></div>
  <div id="eyebrow"></div>
  <div id="headline"></div>
  <div id="panel">
    <div id="plabel"><span id="pl"></span><span id="pr"></span></div>
    <div id="price"></div>
    <div id="bar"><i></i></div>
    <div id="chips"></div>
    <div id="sub"></div>
  </div>
  <div id="cta">Free to try — link in bio</div>
  <script type="module" src="./studio.js"></script>
</body>
</html>
